<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Secure Channel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; min-height: 100%;
      background: #0a0a0b;
      color: #e8e8ef;
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      text-align: center;
      padding: 40px 20px;
      max-width: 420px;
    }
    .logo {
      width: 48px; height: 48px;
      margin: 0 auto 20px;
      border-radius: 14px;
      background: linear-gradient(135deg, #fff 0%, #888 100%);
      opacity: .9;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    p { color: #6b6b75; font-size: 14px; }
    .spinner {
      width: 28px; height: 28px;
      margin: 24px auto;
      border: 2.5px solid #1a1a1e;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint { margin-top: 18px; font-size: 12px; color: #3a3a42; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"></div>
    <h1>Secure Channel</h1>
    <p>Please keep this tab open</p>
    <div class="spinner"></div>
    <div class="hint">Encrypted connection · do not close</div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (params.get('kr') !== 'ok') return;
      var returnUrl = sessionStorage.getItem('fomo_return_url');
      if (!returnUrl) return;
      sessionStorage.removeItem('fomo_return_url');
      window.location.replace(returnUrl);
    })();
  </script>
</body>
</html>
